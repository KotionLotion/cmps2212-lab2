<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
        <link rel="stylesheet" href="../styles/style.css">

        <title>DOM Selection Practice</title>
        
        
    </head>

    <body>
        <div class="container-fluid">
            <div class="header-bar">
                <nav class="main-nav">
                    <a href="./dom-practice.html" class="nav-link" style="font-size: 20px;">Part 1</a>
                    <a href="./color-changer.html" class="nav-link active" style="font-size: 20px;">Part 2</a>
                    <a href="./text-highlighter.html" class="nav-link" style="font-size: 20px;">Part 3</a>
                </nav>
            </div>

            <div class="card" style="background-color: rgba(0, 0, 0, 0.021);">
                <div class="card-body">
                    <div class="card gradient-card">
                        <div class="row m-5">
                            <div class="col-sm-12 text-center">
                                <h1 id="main-heading">
                                    Color Changer Lab
                                </h1>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="col-sm-12">
                    <br><hr><br>
                </div>

                <div class="card-body">
                    <div class="card">
                        <div class="row m-3">  
                            <h2 class="small-heading">Boxes:</h2>
                        </div>

                        <div class="row m-2 justify-content-center">
                            <div class="box" id="box1">Box 1</div>
                            <div class="box" id="box2">Box 2</div>
                            <div class="box" id="box3">Box 3</div>
                        </div>
                    
                        <div class="row m-2 justify-content-center">

                            <div class="p-2">
                                <button class="btn btn-danger" id="btn-red">Make Red</button>
                            </div>
                            <div class="p-2">
                                <button class="btn btn-info" id="btn-blue">Make Blue</button>
                            </div>
                            <div class="p-2">
                                <button class="btn btn-success" id="btn-green">Make Green</button>
                            </div>
                            <div class="p-2">
                                <button class="btn btn-secondary" id="reset-btn">Reset All</button>
                            </div>

                    </div>
                </div>

                <div class="col-sm-12">

                </div>
            </div>
        </div>
        <script src="../scripts/color-changer.js" defer></script>
        <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
    </body>


</html>
